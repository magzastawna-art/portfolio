	var icon = document.getElementById("icon");

icon.onmouseenter = function() {
  if (this.className === "Icon") {
    this.className = "Icon open"; 
  } else {
    this.className = "Icon";
  }
};
icon.onmouseleave = function() {
  if (this.className === "Icon open") {

};
